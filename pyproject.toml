[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yingsha-lead-finder"
version = "0.2.0"
description = "Local, model-free business lead research with OpenClaw and Scrapling"
requires-python = ">=3.11"
dependencies = ["scrapling==0.5", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
yingsha-leads = "yingsha_leads.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yingsha_leads = ["static/*", "scripts/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
